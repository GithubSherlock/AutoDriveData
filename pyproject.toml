[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodrivedata"
version = "0.1.0"
description = "CARLA 仿真数据生成 Pipeline(raw+GT 双输出,供 AutoLabel 消费)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# 仅 base(3.10)采集脚本用;autolabel env 禁止安装(防污染 mmdet3d CUDA13 环境)
carla = ["carla==0.9.16"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["autodrivedata*"]
# tests/ 已收进包内(autodrivedata/tests/),但它不是分发内容 —— 排除,免得装上却不该被 import。
exclude = ["autodrivedata.tests*"]

[tool.pytest.ini_options]
# 裸敲 `pytest` 不再被 hdMapGitHub 下的 6 个上游克隆拖出 190 个 collection error。
# ★ 不要加 `norecursedirs`:它是**覆盖**不是追加(默认 9 项会被换成你写的那几项),
#   实测只加 testpaths 就已解决,列它的那几个目录本来就是 0 个 .py。
testpaths = ["autodrivedata/tests"]

[tool.ruff]
# 项目实际风格 ~110 列(默认 88 会把中文注释/表格式行反复折行)
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 显式钉死规则集:ruff 升级不引入意外新规则(默认只 E4/E7/E9/F)
select = ["E", "F", "I", "UP", "B"]
# E501 行长交给 formatter 管;注释/字符串不强制折行(中文注释折行后更难读)
# E741 `l` 是 KITTI 域约定(Box3D.l = 长度,GT 行列序 h,w,l),改名反而偏离领域词汇
ignore = ["E501", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
